server:
  address: 127.0.0.1
  port: 8081
spring:
  application:
    name: chengjing-team
  datasource:
    url: ${CHENGJING_DB_URL:jdbc:h2:file:./data/chengjing;DB_CLOSE_ON_EXIT=FALSE}
    username: ${CHENGJING_DB_USER:sa}
    password: ${CHENGJING_DB_PASSWORD:}
  flyway:
    enabled: true
chengjing:
  secrets:
    key-file: ${CHENGJING_MASTER_KEY_FILE:./data/master.key}
