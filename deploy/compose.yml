services:
  chengjing:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${CHENGJING_BIND:-127.0.0.1}:8081:8081"
    environment:
      CHENGJING_DB_URL: jdbc:h2:file:/app/data/chengjing;DB_CLOSE_ON_EXIT=FALSE
      CHENGJING_MASTER_KEY_FILE: /app/data/master.key
      CHENGJING_ALLOWED_ORIGINS: ${CHENGJING_ALLOWED_ORIGINS:-http://127.0.0.1:8081,http://localhost:8081}
    volumes:
      - ./data:/app/data
